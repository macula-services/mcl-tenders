<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1500" height="1260"/>
<rect class="b-per" x="50" y="30" width="300" height="120" rx="10"/>
<circle class="head" cx="76" cy="54" r="9"/>
<text class="t-name" x="94" y="58">Tenders role holder</text>
<text class="t-type" x="94" y="76">[Person or agent of the realm]</text>
<text class="t-desc" x="66" y="100">Describes, reads or archives the profile;</text>
<text class="t-desc" x="66" y="116">lists, reads and dismisses tenders,</text>
<text class="t-desc" x="66" y="132">through sealed calls</text>
<rect class="b-mac" x="400" y="30" width="300" height="120" rx="10"/>
<text class="t-name" x="416" y="58">macula link</text>
<text class="t-type" x="416" y="76">[library, on this node]</text>
<text class="t-desc" x="416" y="100">Refuses a call in the clear, and</text>
<text class="t-desc" x="416" y="116">a caller without the tenders role,</text>
<text class="t-desc" x="416" y="132">before any handler runs</text>
<rect class="b-mac" x="750" y="30" width="300" height="120" rx="10"/>
<text class="t-name" x="766" y="58">macula-realm</text>
<text class="t-type" x="766" y="76">[Macula infrastructure]</text>
<text class="t-desc" x="766" y="100">Mints the tenders role and</text>
<text class="t-desc" x="766" y="116">anchors the realm's identity</text>
<rect class="bound" x="30" y="190" width="1440" height="860" rx="12"/>
<text class="t-bound" x="46" y="1040">mcl-tenders [one release]: the profile, the sensor and the morning list</text>
<rect class="b-cmp" x="50" y="230" width="300" height="150" rx="10"/>
<text class="t-code" x="66" y="258">describe_ and archive_ responders</text>
<text class="t-type" x="66" y="276">[guide_tender_lifecycle]</text>
<text class="t-desc" x="66" y="300">describe checks every field; archive</text>
<text class="t-desc" x="66" y="316">ends the realm's search, for good.</text>
<text class="t-desc" x="66" y="332">Each records the caller as who</text>
<text class="t-desc" x="66" y="348">described or archived it.</text>
<rect class="b-sys" x="400" y="230" width="300" height="150" rx="10"/>
<text class="t-code" x="416" y="258">mcl_tenders_service</text>
<text class="t-type" x="416" y="276">[mcl_om service contract]</text>
<text class="t-desc" x="416" y="300">Announces its six procedures,</text>
<text class="t-desc" x="416" y="316">sealed, for the tenders role only.</text>
<text class="t-desc" x="416" y="332">At boot, initiates the realm's</text>
<text class="t-desc" x="416" y="348">profile once. /health: intake, quiet.</text>
<rect class="b-cmp" x="750" y="230" width="300" height="150" rx="10"/>
<text class="t-code" x="766" y="258">get_tender_profile_responder</text>
<text class="t-type" x="766" y="276">[query_tenders]</text>
<text class="t-desc" x="766" y="300">Answers the realm's profile,</text>
<text class="t-desc" x="766" y="316">or a reason. Never the profile</text>
<text class="t-desc" x="766" y="332">of another realm.</text>
<rect class="b-cmp" x="50" y="430" width="300" height="150" rx="10"/>
<text class="t-code" x="66" y="458">tender_profile_aggregate</text>
<text class="t-type" x="66" y="476">[guide_tender_lifecycle, CMD]</text>
<text class="t-desc" x="66" y="500">maybe_initiate_, maybe_describe_,</text>
<text class="t-desc" x="66" y="516">maybe_archive_tender_profile. One</text>
<text class="t-desc" x="66" y="532">dossier per realm; its state holds</text>
<text class="t-desc" x="66" y="548">flags only, never the profile.</text>
<rect class="b-cmp" x="400" y="430" width="300" height="150" rx="10"/>
<text class="t-code" x="416" y="458">*_to_tender_profiles</text>
<text class="t-type" x="416" y="476">[project_tenders, PRJ]</text>
<text class="t-desc" x="416" y="500">One projection per event, through</text>
<text class="t-desc" x="416" y="516">tenders_read_model_store, which</text>
<text class="t-desc" x="416" y="532">keeps no argument in a crash</text>
<text class="t-desc" x="416" y="548">report or a log.</text>
<rect class="b-cmp" x="750" y="430" width="300" height="150" rx="10"/>
<text class="t-code" x="766" y="458">get_tender_profile</text>
<text class="t-type" x="766" y="476">[query_tenders, QRY]</text>
<text class="t-desc" x="766" y="500">find/1 by realm, through</text>
<text class="t-desc" x="766" y="516">tenders_query_store. The sensor</text>
<text class="t-desc" x="766" y="532">and the process manager read</text>
<text class="t-desc" x="766" y="548">it here, in process.</text>
<rect class="b-cmp" x="50" y="630" width="300" height="150" rx="10"/>
<text class="t-code" x="66" y="658">mcl_tenders_store</text>
<text class="t-type" x="66" y="676">[ReckonDB, embedded]</text>
<text class="t-desc" x="66" y="700">Every event of the profile and</text>
<text class="t-desc" x="66" y="716">of each dossier, on this node's</text>
<text class="t-desc" x="66" y="732">disk under /data</text>
<rect class="b-cmp" x="400" y="630" width="300" height="150" rx="10"/>
<text class="t-code" x="416" y="658">tenders.sqlite3</text>
<text class="t-type" x="416" y="676">[SQLite read model]</text>
<text class="t-desc" x="416" y="700">The profile, one row per realm;</text>
<text class="t-desc" x="416" y="716">the tenders, one row per dossier,</text>
<text class="t-desc" x="416" y="732">indexed for the morning list</text>
<rect class="b-ext" x="1100" y="30" width="300" height="120" rx="10"/>
<text class="t-name" x="1116" y="58">TED Search API</text>
<text class="t-type" x="1116" y="76">[External system]</text>
<text class="t-desc" x="1116" y="100">Anonymous, no key. Sees the</text>
<text class="t-desc" x="1116" y="116">realm's CPV codes and countries</text>
<rect class="b-cmp" x="1100" y="430" width="300" height="150" rx="10"/>
<text class="t-code" x="1116" y="458">sense_ted_notices</text>
<text class="t-type" x="1116" y="476">[sense_tender_notices, sensor]</text>
<text class="t-desc" x="1116" y="500">Reads the profile each sweep,</text>
<text class="t-desc" x="1116" y="516">asks TED for its codes and</text>
<text class="t-desc" x="1116" y="532">countries, reports each new</text>
<text class="t-desc" x="1116" y="548">notice, sealed in the realm.</text>
<rect class="b-cmp" x="1100" y="630" width="300" height="150" rx="10"/>
<text class="t-code" x="1116" y="658">mcl_tenders_group_keys</text>
<text class="t-type" x="1116" y="676">[macula_group_keys, distributor]</text>
<text class="t-desc" x="1116" y="700">Hands the tenders group's key</text>
<text class="t-desc" x="1116" y="716">to nodes with the org's grant.</text>
<text class="t-desc" x="1116" y="732">Not started without</text>
<text class="t-desc" x="1116" y="748">MCL_GROUP_ORG_KEY_ID.</text>
<rect class="b-cmp" x="50" y="830" width="300" height="150" rx="10"/>
<text class="t-code" x="66" y="858">tender_aggregate</text>
<text class="t-type" x="66" y="876">[guide_tender_lifecycle, CMD]</text>
<text class="t-desc" x="66" y="900">spot, amend, note the award, dismiss:</text>
<text class="t-desc" x="66" y="916">one dossier per tender, its state</text>
<text class="t-desc" x="66" y="932">flags only. dismiss_tender_responder</text>
<text class="t-desc" x="66" y="948">records the caller.</text>
<rect class="b-cmp" x="400" y="830" width="300" height="150" rx="10"/>
<text class="t-code" x="416" y="858">*_to_tenders</text>
<text class="t-type" x="416" y="876">[project_tenders, PRJ]</text>
<text class="t-desc" x="416" y="900">One upsert per event, in any order:</text>
<text class="t-desc" x="416" y="916">a correction that lands before its</text>
<text class="t-desc" x="416" y="932">spot is kept; status flags are ORed.</text>
<rect class="b-cmp" x="750" y="830" width="300" height="150" rx="10"/>
<text class="t-code" x="766" y="858">get_tenders_page, get_tender_by_id</text>
<text class="t-type" x="766" y="876">[query_tenders, QRY, and responders]</text>
<text class="t-desc" x="766" y="900">The morning list, best first, and</text>
<text class="t-desc" x="766" y="916">the whole dossier. The TED link is</text>
<text class="t-desc" x="766" y="932">rebuilt from the publication</text>
<text class="t-desc" x="766" y="948">number, never taken from a notice.</text>
<rect class="b-cmp" x="1100" y="830" width="300" height="150" rx="10"/>
<text class="t-code" x="1116" y="858">on_tender_notice_reported_v1_*</text>
<text class="t-type" x="1116" y="876">[guide_tender_lifecycle, PM]</text>
<text class="t-desc" x="1116" y="900">Reads each notice again, fits it</text>
<text class="t-desc" x="1116" y="916">(tender_fit: keywords only, #4a),</text>
<text class="t-desc" x="1116" y="932">caps the day's spots (tender_intake),</text>
<text class="t-desc" x="1116" y="948">dispatches in process.</text>
<path class="edge" d="M350 90H400" marker-end="url(#a)"/>
<text class="t-rel" x="375" y="82" text-anchor="middle">call</text>
<path class="edge" d="M1100 505H1050" marker-end="url(#a)"/>
<text class="t-rel" x="1075" y="497" text-anchor="middle">find/1</text>
<path class="edge" d="M1250 430V150" marker-end="url(#a)"/>
<text class="t-rel" x="1258" y="290">days, CPV codes,</text>
<text class="t-rel" x="1258" y="306">countries</text>
<path class="edge" d="M1250 580V630" marker-end="url(#a)"/>
<text class="t-rel" x="1258" y="610">pulls the group key</text>
<path class="edge" d="M750 90H700" marker-end="url(#a)"/>
<text class="t-rel" x="725" y="82" text-anchor="middle">role</text>
<path class="edge" d="M450 150V205H200V230" marker-end="url(#a)"/>
<text class="t-rel" x="208" y="200">describe_ / archive_tender_profile</text>
<path class="edge" d="M650 150V205H900V230" marker-end="url(#a)"/>
<text class="t-rel" x="892" y="200" text-anchor="end">get_tender_profile</text>
<path class="edge" d="M200 380V430" marker-end="url(#a)"/>
<text class="t-rel" x="208" y="410">command</text>
<path class="edge" d="M550 380V405H300V430" marker-end="url(#a)"/>
<text class="t-rel" x="558" y="400">initiates at boot</text>
<path class="edge" d="M900 380V430" marker-end="url(#a)"/>
<text class="t-rel" x="908" y="410">find/1</text>
<path class="edge" d="M200 580V630" marker-end="url(#a)"/>
<text class="t-rel" x="208" y="610">appends events</text>
<path class="edge" d="M350 705H375V530H400" marker-end="url(#a)"/>
<text class="t-rel" x="368" y="620" text-anchor="end" transform="rotate(-90 368 620)">events</text>
<path class="edge" d="M550 580V630" marker-end="url(#a)"/>
<text class="t-rel" x="558" y="610">writes</text>
<path class="edge" d="M900 580V705H700" marker-end="url(#a)"/>
<text class="t-rel" x="908" y="650">reads</text>
<path class="edge" d="M1400 505H1440V905H1400" marker-end="url(#a)"/>
<text class="t-rel" x="1448" y="705" text-anchor="middle" transform="rotate(90 1448 705)">the sealed fact, from the mcl-tenders org</text>
<path class="edge" d="M1150 830V805H1000V580" marker-end="url(#a)"/>
<text class="t-rel" x="1008" y="800">profile</text>
<path class="edge" d="M1250 980V1015H200V980" marker-end="url(#a)"/>
<text class="t-rel" x="725" y="1009" text-anchor="middle">spot, amend, note the award, in process</text>
<path class="edge" d="M200 830V780" marker-end="url(#a)"/>
<text class="t-rel" x="208" y="810">appends events</text>
<path class="edge" d="M350 760H375V905H400" marker-end="url(#a)"/>
<text class="t-rel" x="368" y="870" text-anchor="end" transform="rotate(-90 368 870)">events</text>
<path class="edge" d="M550 830V780" marker-end="url(#a)"/>
<text class="t-rel" x="558" y="810">writes</text>
<path class="edge" d="M750 905H725V760H700" marker-end="url(#a)"/>
<text class="t-rel" x="733" y="800">reads</text>
<text class="t-desc" x="50" y="1090">The profile says what the realm bids for, so it lives on the node's disk, in the event store and the read model, and</text>
<text class="t-desc" x="50" y="1108">nowhere else: not in a log, not in a crash report, not in an aggregate's state. Which notices fit draws the profile's</text>
<text class="t-desc" x="50" y="1126">outline, so the dossiers keep the same rule. Every procedure is sealed and admits only identities the realm granted the</text>
<text class="t-desc" x="50" y="1144">tenders role. The sensor asks TED for the profile's codes and countries only, and its facts travel sealed under the</text>
<text class="t-desc" x="50" y="1162">realm's tenders group, to the process manager the node subscribes once the group is set up. The morning list also</text>
<text class="t-desc" x="50" y="1180">answers as text, one line per tender, for an agent to read out.</text>
<rect class="b-sys" x="24" y="1220" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="1232">In scope</text>
<rect class="b-per" x="110.8" y="1220" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="1232">Person</text>
<rect class="b-mac" x="184.39999999999998" y="1220" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="1232">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="1220" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="1232">External system</text>
<rect class="b-cmp" x="490.0" y="1220" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="1232">Container or component</text>
<rect class="bound" x="669.2" y="1220" width="22" height="14" rx="3"/>
<text class="t-leg" x="699.2" y="1232">Boundary</text>
</svg>
